apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - lane: public
            target: 128.39.142.138
          - lane: internal
            target: 128.39.140.144
  template:
    metadata:
      name: 'external-dns-{{.lane}}'
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: 1.21.1
        helm:
          releaseName: 'external-dns-{{.lane}}'
          valuesObject:
            sources:
              - ingress
            policy: sync
            registry: txt
            txtOwnerId: 'apiary-{{.lane}}'
            txtPrefix: 'edns-{{.lane}}-'
            domainFilters:
              - login.no
            extraArgs:
              - '--ingress-class={{.lane}}'
              - '--default-targets={{.target}}'
              - --force-default-targets
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 128Mi
            provider:
              name: webhook
              webhook:
                securityContext:
                  runAsUser: 65532
                  runAsGroup: 65532
                image:
                  repository: ghcr.io/amoniacou/external-dns-digitalocean-webhook
                  tag: 1.0.2@sha256:bb5b8e2a9b432cd5ec85a336f13598493ccf7860146efee6e13f0e6be33efac0
                env:
                  - name: DO_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: digitalocean-dns
                        key: token
                  - name: DO_DOMAIN_FILTER
                    value: login.no
                  - name: WEBHOOK_PORT
                    value: "8888"
                  - name: HEALTH_PORT
                    value: "8080"
                  - name: HEALTH_HOST
                    value: 0.0.0.0
                resources:
                  requests:
                    cpu: 15m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: external-dns
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
