apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - lane: public
            vip: 10.30.0.40
            proxyFrom: 10.30.0.10/32
            gateway: "true"
          - lane: internal
            vip: 10.30.0.41
            proxyFrom: 10.10.0.21/32
            gateway: "false"
  template:
    metadata:
      name: 'traefik-{{.lane}}'
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://helm.traefik.io/traefik
        chart: traefik
        targetRevision: 42.3.1
        helm:
          parameters:
            - name: providers.kubernetesGateway.enabled
              value: '{{.gateway}}'
          valuesObject:
            ingressClass:
              isDefaultClass: false
              name: '{{.lane}}'
            providers:
              kubernetesCRD:
                ingressClass: '{{.lane}}'
              kubernetesIngress:
                ingressClass: '{{.lane}}'
            service:
              annotations:
                metallb.io/loadBalancerIPs: '{{.vip}}'
              spec:
                externalTrafficPolicy: Local
            ports:
              web:
                http:
                  redirections:
                    entryPoint:
                      to: websecure
                      scheme: https
                      permanent: true
              websecure:
                proxyProtocol:
                  trustedIPs: ['{{.proxyFrom}}']
                forwardedHeaders:
                  trustedIPs: ['{{.proxyFrom}}']
            gateway:
              listeners:
                websecure:
                  port: 8443
                  protocol: HTTPS
                  namespacePolicy:
                    from: All
                  certificateRefs:
                    - name: wildcard-login-no
                    - name: other-domains
            accessLog:
              enabled: true
              format: json
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: traefik
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
