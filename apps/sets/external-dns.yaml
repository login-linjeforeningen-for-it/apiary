apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - lane: public
            target: 128.39.142.138
          - lane: internal
            target: 128.39.140.144
  template:
    metadata:
      name: 'external-dns-{{.lane}}'
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: 1.21.1
        helm:
          valuesObject:
            sources:
              - ingress
            # upsert-only through the DO -> OVH cutover so a misconfig can't
            # prune the zone. Switch back to `sync` once verified.
            policy: upsert-only
            txtOwnerId: 'apiary-{{.lane}}'
            txtPrefix: 'edns-{{.lane}}-'
            domainFilters:
              - login.no
            provider:
              name: ovh
            extraArgs:
              - '--ingress-class={{.lane}}'
              - '--default-targets={{.target}}'
              - --force-default-targets
              - --ovh-endpoint=ovh-ca
            env:
              - name: OVH_APPLICATION_KEY
                valueFrom:
                  secretKeyRef:
                    name: ovh-dns
                    key: OVH_APPLICATION_KEY
              - name: OVH_APPLICATION_SECRET
                valueFrom:
                  secretKeyRef:
                    name: ovh-dns
                    key: OVH_APPLICATION_SECRET
              - name: OVH_CONSUMER_KEY
                valueFrom:
                  secretKeyRef:
                    name: ovh-dns
                    key: OVH_CONSUMER_KEY
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 128Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: external-dns
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
