apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - externalsecret.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: login

configMapGenerator:
  - name: workerbee-env
    literals:
      - PORT=8081
      - DB=workerbee
      - DB_USER=workerbee
      - DB_HOST=workerbee-db-rw
      - DB_PORT=5432
      - S3_URL=https://s3.de.io.cloud.ovh.net
      - S3_REGION=de
      - S3_BUCKET=tekkom-beehive
      - S3_PATH_STYLE=false
      - ALLOWED_PROTECTED_REQUESTS=25

images:
  - name: ghcr.io/login-linjeforeningen-for-it/workerbee
    newTag: sha-e68aa9b
