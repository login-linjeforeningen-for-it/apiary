apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workerbee
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: workerbee-secrets
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: workerbee/S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: workerbee/S3_SECRET_ACCESS_KEY
