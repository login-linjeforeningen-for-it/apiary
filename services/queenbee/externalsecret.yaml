apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: queenbee
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: queenbee-secrets
  data:
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: queenbee/AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: queenbee/AUTHENTIK_CLIENT_SECRET
    - secretKey: APP_API_ADMIN_TOKEN
      remoteRef:
        key: queenbee/APP_API_ADMIN_TOKEN
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef:
        key: queenbee/AUTHENTIK_API_TOKEN
