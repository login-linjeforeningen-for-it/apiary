{{- range $from, $to := .Values.redirects }}
{{- $url := urlParse $to }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $from | replace "." "-" }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{ $from }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ $url.host }}
            {{- with $url.path }}
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ . }}
            {{- end }}
            statusCode: 301
{{- end }}
