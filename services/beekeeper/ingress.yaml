apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beekeeper
spec:
  ingressClassName: public
  tls:
    - hosts:
        - beekeeper-next.login.no
  rules:
    - host: beekeeper-next.login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beekeeper
                port:
                  number: 8080
