apiVersion: apps/v1
kind: Deployment
metadata:
  name: beekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beekeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beekeeper
    spec:
      containers:
        - name: beekeeper
          image: ghcr.io/login-linjeforeningen-for-it/beekeeper/api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: beekeeper-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
