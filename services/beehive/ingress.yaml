apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beehive
spec:
  ingressClassName: public
  tls:
    - hosts:
        - login.no
        - beehive.login.no
  rules:
    - host: login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beehive
                port:
                  number: 3000
    - host: beehive.login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beehive
                port:
                  number: 3000
