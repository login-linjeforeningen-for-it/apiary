apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - externalsecret.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: login

configMapGenerator:
  - name: studentbee-env
    literals:
      - NODE_ENV=production
      - TZ=Europe/Oslo
      - AUTHENTIK_URL=https://authentik.login.no
      - API_URL=http://studentbee-api:8080/api
      - NEXT_PUBLIC_BROWSER_API_URL=https://studentbee-api.login.no
      - DB=studentbee
      - DB_USER=studentbee
      - DB_HOST=studentbee-db-rw
      - DB_PORT=5432

images:
  - name: ghcr.io/login-linjeforeningen-for-it/studentbee/frontend
    newTag: sha-277d0b6
  - name: ghcr.io/login-linjeforeningen-for-it/studentbee/api
    newTag: sha-277d0b6
