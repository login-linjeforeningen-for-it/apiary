apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studentbee
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: studentbee
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: studentbee/CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: studentbee/CLIENT_SECRET
