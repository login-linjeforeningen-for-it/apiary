apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentbee
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studentbee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studentbee
    spec:
      containers:
        - name: studentbee
          image: ghcr.io/login-linjeforeningen-for-it/studentbee/frontend
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: studentbee-env
            - secretRef:
                name: studentbee
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentbee-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studentbee-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studentbee-api
    spec:
      containers:
        - name: studentbee-api
          image: ghcr.io/login-linjeforeningen-for-it/studentbee/api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: studentbee-env
            - secretRef:
                name: studentbee
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studentbee-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
