apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: cnpg-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg-backup/ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg-backup/SECRET_ACCESS_KEY
    - secretKey: REGION
      remoteRef:
        key: cnpg-backup/REGION
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: beeformed
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tekkom-backup
    endpointURL: https://s3.de.io.cloud.ovh.net
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: SECRET_ACCESS_KEY
      region:
        name: cnpg-backup-s3
        key: REGION
    wal:
      compression: zstd
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: beeformed-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  bootstrap:
    initdb:
      database: beeformed
      owner: beeformed
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: beeformed
        serverName: beeformed
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: beeformed-db
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: beeformed-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
