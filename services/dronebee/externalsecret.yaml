apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dronebee
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: dronebee-secrets
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: dronebee/DISCORD_TOKEN
    - secretKey: TEKKOM_BOT_API_TOKEN
      remoteRef:
        key: dronebee/TEKKOM_BOT_API_TOKEN
    - secretKey: WIKIJS_TOKEN
      remoteRef:
        key: dronebee/WIKIJS_TOKEN
    - secretKey: HEARTBEAT_URL
      remoteRef:
        key: dronebee/HEARTBEAT_URL
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: dronebee/CLIENT_SECRET
    - secretKey: SPOTIFY_CLIENT_ID
      remoteRef:
        key: dronebee/SPOTIFY_CLIENT_ID
    - secretKey: SPOTIFY_CLIENT_SECRET
      remoteRef:
        key: dronebee/SPOTIFY_CLIENT_SECRET
    - secretKey: WEBHOOK_URL
      remoteRef:
        key: dronebee/WEBHOOK_URL
