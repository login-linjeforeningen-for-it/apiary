apiVersion: apps/v1
kind: Deployment
metadata:
  name: dronebee
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dronebee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dronebee
    spec:
      containers:
        - name: dronebee
          image: ghcr.io/login-linjeforeningen-for-it/dronebee
          envFrom:
            - configMapRef:
                name: dronebee-env
            - secretRef:
                name: dronebee-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dronebee-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dronebee-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dronebee-api
    spec:
      containers:
        - name: dronebee-api
          image: ghcr.io/login-linjeforeningen-for-it/dronebee/api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dronebee-env
            - secretRef:
                name: dronebee-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dronebee-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
