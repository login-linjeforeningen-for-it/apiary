apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dronebee-api
spec:
  ingressClassName: public
  tls:
    - hosts:
        - bot.login.no
  rules:
    - host: bot.login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dronebee-api
                port:
                  number: 8080
