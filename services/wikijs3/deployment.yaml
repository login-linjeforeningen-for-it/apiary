apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikijs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wikijs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wikijs
    spec:
      containers:
        - name: wikijs
          image: ghcr.io/requarks/wiki
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: wikijs-env
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: wikijs3-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /_live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_ready
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
