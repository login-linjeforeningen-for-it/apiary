apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wikijs
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: wikijs3-styret-minutes@kubernetescrd
spec:
  ingressClassName: public
  tls:
    - hosts:
        - wiki.login.no
  rules:
    - host: wiki.login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wikijs
                port:
                  number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: styret-minutes
spec:
  redirectRegex:
    regex: ^(?i)https://wiki\.login\.no(?:/en)?/public/docs/minutes(?:/styrem(?:o|ø|%C3%B8)ter)?(/.*)?$
    replacement: https://wiki.login.no/styret/meetings${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dronebee
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wikijs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dronebee
      ports:
        - port: http
