apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wikijs
spec:
  ingressClassName: internal
  tls:
    - hosts:
        - wiki-next.login.no
  rules:
    - host: wiki-next.login.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wikijs
                port:
                  number: 3000
