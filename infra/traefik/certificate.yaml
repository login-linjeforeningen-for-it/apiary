apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-login-no
  namespace: traefik
spec:
  secretName: wildcard-login-no
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "login.no"
    - "*.login.no"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: other-domains
  namespace: traefik
spec:
  secretName: other-domains
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - logout.no
